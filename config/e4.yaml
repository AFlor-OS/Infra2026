# Configuração exclusiva do experimento E4 - Saturação

execution:
  warmups: 1
  pause_seconds: 2
  random_seed: 2026

statistics:
  confidence_level: 0.95
  pilot_repetitions: 3
  default_repetitions: 10
  saturation_repetitions: 5

  adaptive:
    enabled: false
    relative_ci_half_width: 0.05
    batch_size: 5
    max_repetitions: 20

  bootstrap:
    enabled: true
    samples: 10000
    confidence_level: 0.95

experiments:
  strong:
    enabled: false

  weak:
    enabled: false

  saturation:
    enabled: true
    scenario: E4
    matrix_sizes: [1008, 2016, 4032]
    processes: [1, 2, 4, 7, 8, 14]
    repetitions: 5

calibration:
  target_min_seconds: 60
  target_max_seconds: 120
  target_seconds: 90
  start_matrix_size: 4960
  max_matrix_size: 6144
  max_search_attempts: 8
